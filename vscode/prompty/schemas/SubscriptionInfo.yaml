$schema: https://json-schema.org/draft/2020-12/schema
$id: SubscriptionInfo.yaml
type: object
properties:
  subscriptionId:
    type: string
    description: Stable provider subscription identifier
  displayName:
    type: string
    description: Human-readable subscription name
  state:
    type: string
    description: Provider-reported lifecycle state
required:
  - subscriptionId
  - displayName
  - state
description: A cloud subscription or account boundary available to the authenticated user.
