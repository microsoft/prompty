$schema: https://json-schema.org/draft/2020-12/schema
$id: CustomParser.yaml
type: object
properties:
  kind:
    type: string
    const: "*"
    description: The wildcard parser discriminator for any kind not explicitly modeled
required:
  - kind
allOf:
  - $ref: ParserConfig.yaml
description: |-
  Wildcard catch-all parser for downstream/unregistered parser kinds. The `"*"`
  discriminator lowers to the Parser dispatch decl's `defaultVariant`.
