$schema: https://json-schema.org/draft/2020-12/schema
$id: AnthropicModelInfo.yaml
type: object
properties:
  id:
    type: string
    description: The model identifier
  display_name:
    type: string
    description: The human-readable model name
  created_at:
    type: string
    description: The RFC 3339 timestamp when the model was created
  type:
    type: string
    description: The API object type
  context_length:
    type: integer
    minimum: -2147483648
    maximum: 2147483647
    description: The model context window when supplied by the endpoint
  input_modalities:
    type: array
    items:
      type: string
    description: Input modalities when supplied by the endpoint
  output_modalities:
    type: array
    items:
      type: string
    description: Output modalities when supplied by the endpoint
required:
  - id
description: A model entry returned by Anthropic's model listing API.
