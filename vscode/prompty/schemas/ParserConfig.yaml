$schema: https://json-schema.org/draft/2020-12/schema
$id: ParserConfig.yaml
type: object
properties:
  kind:
    $ref: ParserKind.yaml
    default: "*"
    description: Parser used to process the rendered template into API-compatible format
  options:
    $ref: RecordUnknown.yaml
    description: Options for the parser
required:
  - kind
description: |-
  Template parser definition. `kind` is the `@dispatch` discriminator for the
  Parser seam, reached from a seam param as `agent.template.parser.kind`.
