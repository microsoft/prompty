$schema: https://json-schema.org/draft/2020-12/schema
$id: OpenAIModelInfo.yaml
type: object
properties:
  id:
    type: string
    description: The model identifier
  object:
    type: string
    description: The API object type
  created:
    type: string
    description: Unix timestamp when the model was created
  owned_by:
    type: string
    description: The organization or user that owns the model
required:
  - id
description: A model entry returned by OpenAI's model listing API.
