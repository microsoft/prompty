$schema: https://json-schema.org/draft/2020-12/schema
$id: AnthropicModelsResponse.yaml
type: object
properties:
  data:
    type: array
    items:
      $ref: AnthropicModelInfo.yaml
    description: Models available to the authenticated caller
  first_id:
    type: string
    description: The first model identifier in this page
  has_more:
    type: boolean
    description: Whether another page is available
  last_id:
    type: string
    description: The last model identifier in this page
required:
  - data
description: The response body from Anthropic's model listing API.
