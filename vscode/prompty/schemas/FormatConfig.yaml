$schema: https://json-schema.org/draft/2020-12/schema
$id: FormatConfig.yaml
type: object
properties:
  kind:
    $ref: FormatKind.yaml
    default: "*"
    description: Template rendering engine used for slot filling prompts (e.g., mustache, jinja2)
  strict:
    type: boolean
    default: false
    description: Whether the template can emit structural text for parsing output
  options:
    $ref: RecordUnknown.yaml
    description: Options for the template engine
required:
  - kind
description: |-
  Template format definition. `kind` is the `@dispatch` discriminator for the
  Renderer seam, reached from a seam param as `agent.template.format.kind`.
