name: prompty Swift build and test
on:
  pull_request:
    paths:
      - 'runtime/swift/**'
      - 'schema/**'
      - '.github/workflows/prompty-swift-check.yml'

  workflow_call:

jobs:
  swift-tests:
    name: test Swift on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux has no Xcode, so install a pinned standalone Swift toolchain.
      - name: Install Swift toolchain (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '6.0'

      # macOS ships Xcode whose bundled Swift compiler is matched to its SDK.
      # A standalone toolchain from setup-swift pins the compiler but still uses
      # the runner's newer Xcode SDK, which fails with "this SDK is not supported
      # by the compiler". Select Xcode explicitly and use its bundled Swift so the
      # compiler and SDK stay in lockstep. See issue #474 (toolchain pinning).
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Report Swift version
        run: swift --version

      # The generated model package is standalone (no remote dependencies) and
      # is the source of truth for the runtime contract, so it is built first.
      - name: Build and test prompty-model
        working-directory: runtime/swift/prompty-model
        run: swift test

      # The hand-written runtime depends on prompty-model (local path) and Yams.
      - name: Build and test prompty runtime
        working-directory: runtime/swift/prompty
        run: swift test
