name: TEMP regen for emitter 1.0.1

# TEMPORARY, DELETE AFTER USE. Mirrors schema-repro-check.yml's pinned toolchain
# exactly, runs `npm run generate` from the 1.0.1 emitter, and uploads the
# resulting generated-code delta as a binary patch artifact for local apply.
# Windows regen is non-reproducible, so the authoritative regen must run here.

on:
  push:
    branches:
      - sethjuarez/jinja-subset-conformance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen-and-upload-patch:
    name: regenerate and upload patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Install Rust toolchain (provides rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt

      - name: Set up Go (provides gofmt)
        uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go/prompty/go.mod
          cache: false

      - name: Set up .NET (provides dotnet format)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.317'

      - name: Install TypeScript workspace (provides prettier and eslint)
        working-directory: runtime/typescript
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dev tooling (provides ruff)
        working-directory: runtime/python/prompty
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Install schema dependencies
        working-directory: schema
        run: npm ci

      - name: Record toolchain versions
        shell: bash
        run: |
          echo "node      $(node --version)"
          echo "rustc     $(rustc --version)"
          echo "rustfmt   $(rustfmt --version)"
          echo "go        $(go version)"
          echo "dotnet    $(dotnet --version)"
          echo "uv        $(uv --version)"
          ( cd runtime/python/prompty && echo "ruff      $(uv run ruff --version)" )
          ( cd runtime/typescript && echo "prettier  $(node node_modules/prettier/bin/prettier.cjs --version)" )
          echo "emitter   $(node -p "require('./schema/package.json').dependencies['@typra/emitter']")"

      - name: Regenerate from the pinned emitter
        working-directory: schema
        shell: bash
        run: |
          set -o pipefail
          npm run generate 2>&1 | tee "$RUNNER_TEMP/generate.log"
          if grep -Eq 'Warning: (prettier|ruff|gofmt|goimports|dotnet format|cargo fmt|Could not find)' "$RUNNER_TEMP/generate.log"; then
            echo "::error::A formatter was unavailable during generation; output is not comparable."
            grep -E 'Warning: ' "$RUNNER_TEMP/generate.log" || true
            exit 1
          fi

      - name: Capture patch
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by regeneration." | tee regen-1.0.1.patch
          else
            git --no-pager diff --cached --stat
            git diff --cached --binary > regen-1.0.1.patch
          fi

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: regen-1.0.1-patch
          path: regen-1.0.1.patch
          retention-days: 3
