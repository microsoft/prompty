name: schema regen (produce patch artifact)

# TEMPORARY helper, companion to schema-repro-check.yml. That gate ASSERTS the
# committed generated tree matches the pinned @typra/emitter plus the repo's
# formatters; it deliberately does not write anything back. When the pin is bumped
# (e.g. @typra/emitter 0.13.0 -> 1.0.0) the committed tree legitimately needs to be
# regenerated, but reproducing the gate's exact pinned toolchain (node 22.23.2,
# rustfmt 1.97.1, dotnet 9.0.317, gofmt via go.mod, ruff, prettier) byte-for-byte on
# a developer machine is fragile: a single formatter-version skew yields output the
# gate then rejects. This job runs the SAME pinned toolchain the gate uses, runs the
# generator, and uploads the resulting diff as a patch artifact. A maintainer
# downloads it, `git apply`s it, and commits the regeneration with real authorship.
# Delete this workflow once the 1.0.0 regeneration has landed.
on:
  workflow_dispatch:
  # workflow_dispatch only works once a workflow is on the default branch; this one
  # lives only on the feature branch, so a branch-scoped push trigger is what actually
  # fires it. Scoped to the single working branch so it cannot run anywhere else.
  push:
    branches:
      - sethjuarez/jinja-subset-conformance

permissions:
  contents: read

jobs:
  regenerate-and-upload-patch:
    name: regenerate and upload patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@v7

      # Toolchain pinned identically to schema-repro-check.yml so the patch this job
      # produces is exactly what that gate will accept. Keep these in lockstep.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Install Rust toolchain (provides rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt

      - name: Set up Go (provides gofmt)
        uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go/prompty/go.mod
          cache: false

      - name: Set up .NET (provides dotnet format)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.317'

      - name: Install TypeScript workspace (provides prettier and eslint)
        working-directory: runtime/typescript
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dev tooling (provides ruff)
        working-directory: runtime/python/prompty
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Install schema dependencies
        working-directory: schema
        run: npm ci

      - name: Record toolchain versions
        shell: bash
        run: |
          echo "node      $(node --version)"
          echo "rustc     $(rustc --version)"
          echo "rustfmt   $(rustfmt --version)"
          echo "go        $(go version)"
          echo "dotnet    $(dotnet --version)"
          dotnet --list-sdks
          echo "uv        $(uv --version)"
          ( cd runtime/python/prompty && echo "ruff      $(uv run ruff --version)" )
          ( cd runtime/typescript && echo "prettier  $(node node_modules/prettier/bin/prettier.cjs --version)" )
          echo "emitter   $(node -p "require('./schema/package.json').dependencies['@typra/emitter']")"

      - name: Regenerate from the pinned emitter
        working-directory: schema
        shell: bash
        run: |
          set -o pipefail
          npm run generate 2>&1 | tee "$RUNNER_TEMP/generate.log"

          # Same guard as the gate: a missing formatter yields unformatted output that
          # looks like drift. Refuse to produce a patch from a degraded environment.
          if grep -Eq 'Warning: (prettier|ruff|gofmt|goimports|dotnet format|cargo fmt|Could not find)' "$RUNNER_TEMP/generate.log"; then
            echo "::error::A formatter was unavailable during generation; the patch would contain unformatted output. Aborting."
            grep -E 'Warning: ' "$RUNNER_TEMP/generate.log" || true
            exit 1
          fi

      - name: Build patch
        shell: bash
        run: |
          # Stage everything so new / deleted / renamed generated files are captured,
          # then emit a binary-safe patch of the full diff against the committed tree.
          git add -A
          git -c core.autocrlf=false --no-pager diff --cached --binary > "$RUNNER_TEMP/regen.patch"
          echo "--- changed files ---"
          git --no-pager diff --cached --stat | tail -60
          echo "--- patch size ---"
          wc -c "$RUNNER_TEMP/regen.patch"
          cp "$RUNNER_TEMP/regen.patch" "$GITHUB_WORKSPACE/regen.patch"

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema-regen-patch
          path: regen.patch
          if-no-files-found: error
          retention-days: 7
