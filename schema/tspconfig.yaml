emit:
  - "@typespec/json-schema"
  - "@typra/emitter"
options:
  "@typespec/json-schema":
    emitter-output-dir: "{cwd}/../vscode/prompty/schemas"
    emitAllModels: true
    emitAllRefs: true
    file-type: yaml
  "@typra/emitter":
    emitter-output-dir: "{cwd}/tsp-output"
    root-object: "Prompty.Prompty"
    emit-targets:
      - type: TypeScript
        output-dir: "../runtime/typescript/packages/core/src/model"
        test-dir: "../runtime/typescript/packages/core/tests/model"
        import-path: "../../src/model/index"
      - type: Python
        output-dir: "../runtime/python/prompty/prompty/model"
        test-dir: "../runtime/python/prompty/tests/model"
        import-path: "prompty.model"
      - type: CSharp
        output-dir: "../runtime/csharp/Prompty.Core/Model"
        test-dir: "../runtime/csharp/Prompty.Core.Tests/Model"
        namespace: "Prompty.Core"
      - type: Go
        output-dir: "../runtime/go/prompty/model"
        test-dir: "../runtime/go/prompty/model"
        import-path: "prompty/model"
        package-name: "prompty"
      - type: Rust
        output-dir: "../runtime/rust/prompty/src/model"
        test-dir: "../runtime/rust/prompty/tests/model"
        import-path: "prompty::model"
      - type: Swift
        output-dir: "../runtime/swift/prompty-model"
        package-name: "PromptyModel"
        # test-dir is intentionally omitted: the Typra Swift emitter emits tests
        # that do not compile. Measured by generating them and building — 1184
        # errors at 0.4.3, down to 180 at 0.4.8, in four classes: element-level
        # enum cases applied to array/optional types (`[Tool]?` has no member
        # `customTool`), struct-style member access on polymorphic enums
        # (`Property.kind`, where `Property` is an enum) alongside references to
        # properties that do not exist (`ApiKeyConnection.key`; the property is
        # `apiKey`), a typed enum compared against a raw string
        # (`AuthenticationMode` vs `String`), and mis-cased or unqualified type
        # references (`mcpApprovalModeKind` and `apiType` for the emitted
        # `McpApprovalModeKind` and `ApiType`). These are test-generator defects,
        # disjoint from the source-generator ones 0.4.3 and 0.4.6 fixed. Note the
        # library must compile before this is measurable: if it fails first the
        # test target is never built and the error count is misleadingly small.
        # Reported upstream; restore test-dir once fixed. Model round-trip
        # coverage lives in runtime/swift/prompty meanwhile.
      - type: markdown
        output-dir: "../web/src/content/docs/reference"
