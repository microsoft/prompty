emit:
  - "@typespec/json-schema"
  - "@typra/emitter"
options:
  "@typespec/json-schema":
    emitter-output-dir: "{cwd}/../vscode/prompty/schemas"
    emitAllModels: true
    emitAllRefs: true
    file-type: yaml
  "@typra/emitter":
    emitter-output-dir: "{cwd}/tsp-output"
    root-object: "Prompty.Prompty"
    emit-targets:
      - type: TypeScript
        output-dir: "../runtime/typescript/packages/core/src/model"
        test-dir: "../runtime/typescript/packages/core/tests/model"
        import-path: "../../src/model/index"
      - type: Python
        output-dir: "../runtime/python/prompty/prompty/model"
        test-dir: "../runtime/python/prompty/tests/model"
        import-path: "prompty.model"
      - type: CSharp
        output-dir: "../runtime/csharp/Prompty.Core/Model"
        test-dir: "../runtime/csharp/Prompty.Core.Tests/Model"
        namespace: "Prompty.Core"
      - type: Go
        output-dir: "../runtime/go/prompty/model"
        test-dir: "../runtime/go/prompty/model"
        import-path: "prompty/model"
        package-name: "prompty"
      - type: Rust
        output-dir: "../runtime/rust/prompty/src/model"
        test-dir: "../runtime/rust/prompty/tests/model"
        import-path: "prompty::model"
      - type: Swift
        output-dir: "../runtime/swift/prompty-model"
        package-name: "PromptyModel"
        # test-dir is intentionally omitted: the Typra Swift emitter emits tests
        # that do not compile. Measured by generating them and building — 1184
        # errors in four classes: optionals left unwrapped (`[String]?.count`),
        # struct-style member access on polymorphic enums (`tool.name` where
        # `Tool` is an enum), compound values compared to their scalar
        # shorthand (`FormatConfig` vs `String`), and references to test helpers
        # that are never emitted (`FixtureRoot`). Still present at 0.4.3, and
        # disjoint from the source-generator defects 0.4.3 fixed — so those
        # fixes could not have made these compile. Reported upstream; restore
        # test-dir once fixed. Model round-trip coverage lives in
        # runtime/swift/prompty meanwhile.
      - type: markdown
        output-dir: "../web/src/content/docs/reference"
